<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">头像占位图</title>
  <desc id="desc">抽象几何头像，待替换为个人照片</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c5a9"/>
      <stop offset="1" stop-color="#aa5c3d"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="430" cy="120" r="150" fill="#efe5d4" opacity=".28"/>
  <path d="M0 505c130-137 253-187 370-150 88 28 165 107 230 237v8H0z" fill="#263a32"/>
  <circle cx="294" cy="237" r="118" fill="#ead7bd"/>
  <path d="M176 235c14-122 78-173 174-137 76 29 89 94 57 154-9-49-30-86-65-111-35 62-90 95-166 94z" fill="#28352f"/>
  <path d="M232 333c29 26 78 26 112 0l15 56-69 64-75-65z" fill="#dcb894"/>
  <g filter="url(#grain)"><rect width="600" height="600" fill="transparent"/></g>
</svg>
